name: Update stars

# Replaces the old bintang-kecil systemd timer (ran 06:00 + on boot on the
# local laptop). Now the scrape runs entirely on GitHub.
on:
  schedule:
    # 00:00 UTC = 07:00 WIB, daily
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual run via the Actions tab

permissions:
  contents: write # needed to push the generated README/JSON/CSV back

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run categorization tests
        run: python3 -m unittest discover tests -v

      # laya checkpoint cache (~0.9 GB for the English checkpoint).
      # Keyed to the checkpoint id; bump the suffix to force a re-download.
      - name: Cache laya checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: laya-english-convaiinnovations-laya-v1
          restore-keys: laya-english-

      - name: Install laya (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install laya

      - name: Scrape starred repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_LAYA: "1"
          LAYA_DEVICE: "cpu"
          LAYA_MIN_CONFIDENCE: "0.55"
        run: python3 scrape.py budi-imam-prasetyo --laya

      - name: Commit and push if changed
        run: |
          git config user.name "budi-imam-prasetyo"
          git config user.email "budiimamprsty@gmail.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "Update stars: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "Pushed update."
          else
            echo "No data changes — nothing to commit."
          fi
